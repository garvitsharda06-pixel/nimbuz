# Indian transaction cost model. Rates are fractions of turnover unless noted.
# Every rate cites its source and check date (see docs/DECISIONS.md D-020).
# Never auto-edited. Changing a rate is a human decision, recorded in DECISIONS.md.

checked: "2026-10-12"

cash_intraday:
  brokerage: {pct: 0.001, cap_inr: 20.0}      # Upstox: min(₹20, 0.1%) per executed order (VERIFY-ON-FIRST-RUN)
  stt_sell: 0.00025                           # 0.025% sell side
  exchange_txn: 0.0000307                     # NSE 0.00297% + IPFT ₹10/cr, conservative (D-020)
  sebi_fee: 0.000001                          # ₹10 per crore
  stamp_buy: 0.00003                          # 0.003% buy side
  gst: 0.18                                   # on brokerage + exchange txn + SEBI fee

futures:
  brokerage: {pct: 0.0005, cap_inr: 20.0}     # Upstox: min(₹20, 0.05%)
  stt_sell: 0.0005                            # 0.05% sell side since 1 Apr 2026 (Budget 2026)
  exchange_txn: 0.0000183                     # NSE 0.00173% + IPFT, conservative
  sebi_fee: 0.000001
  stamp_buy: 0.00002                          # 0.002% buy side
  gst: 0.18
