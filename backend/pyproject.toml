[project]
name = "dalal-desk"
version = "0.1.0"
description = "Personal NSE intraday research and signal terminal (no order placement)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.1",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "shap>=0.46",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "apscheduler>=3.10,<4",
  "structlog>=24",
  "typer>=0.12",
  "protobuf>=7.35",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "grpcio-tools>=1.66", "types-PyYAML"]

[project.scripts]
dalal = "dalal.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dalal*"]

[tool.setuptools.package-data]
dalal = ["**/*.proto", "api/static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dalal/data/proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: longer end-to-end research tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["dalal/data/proto/"]
check_untyped_defs = true
