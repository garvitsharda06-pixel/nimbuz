<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dalal Desk · Price Feed</title>
<style>
  :root { --bg:#0a0b0d; --panel:#111317; --line:#1f232a; --text:#d6dae0; --mute:#7c8591; --up:#22c55e; --dn:#ef4444; --amber:#f59e0b; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 Inter, system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .badge { padding:2px 8px; border:1px solid var(--line); border-radius:4px; font-size:11px; letter-spacing:.04em; }
  .syn { color:var(--amber); border-color:var(--amber); }
  main { display:grid; grid-template-columns: 2fr 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; min-width:0; }
  canvas { width:100%; height:320px; display:block; }
  table { width:100%; border-collapse:collapse; } td,th { padding:3px 6px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; } th { color:var(--mute); font-weight:500; }
  .fu { animation: fu .6s; } .fd { animation: fd .6s; }
  @keyframes fu { from { background:rgba(34,197,94,.35);} to {background:transparent;} }
  @keyframes fd { from { background:rgba(239,68,68,.35);} to {background:transparent;} }
  button, select, input { background:#181b21; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--mute); }
</style>
</head>
<body>
<header>
  <strong>DALAL DESK</strong><span class="mute">price feed (Phase 1 debug view)</span>
  <span id="mode" class="badge">IDLE</span><span id="prov" class="badge"></span>
  <span class="num" id="clock">--:--:--</span>
  <span><span class="dot" id="hdot"></span> <span id="health" class="num"></span></span>
  <select id="day"></select>
  <select id="speed"><option>1</option><option>5</option><option>10</option><option selected>30</option><option>60</option></select>
  <button id="go">Replay</button><button id="pause">Pause</button>
</header>
<main>
  <section><div id="title" class="mute">Benchmark · 5-min</div><canvas id="cv"></canvas></section>
  <section style="max-height:360px; overflow:auto"><table><thead><tr><th>Symbol</th><th>LTP</th><th>Chg%</th></tr></thead><tbody id="tb"></tbody></table></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let insts = {}, roles = {}, first = {}, rows = {}, bars = [], paused = false;
async function init() {
  const r = await (await fetch('/api/instruments')).json();
  roles = r.roles; r.instruments.forEach(i => insts[i.key] = i);
  const d = await (await fetch('/api/days')).json();
  $('prov').textContent = d.provenance.toUpperCase(); if (d.provenance === 'synthetic') $('prov').classList.add('syn');
  $('day').innerHTML = d.days.slice().reverse().map(x => `<option>${x}</option>`).join('');
  connect();
}
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => { const m = JSON.parse(typeof e.data === 'string' ? e.data : new TextDecoder().decode(e.data)); handle(m); };
  ws.onclose = () => setTimeout(connect, 1000);
}
function handle(m) {
  if (m.type === 'status') { $('mode').textContent = m.mode + (m.replay_day ? ' ' + m.replay_day : ''); $('clock').textContent = m.clock.slice(11, 19); }
  if (m.type === 'health') { $('health').textContent = m.state + (m.last_event_age_s != null ? ` ${m.last_event_age_s}s` : ''); $('hdot').style.background = m.state === 'OK' ? 'var(--up)' : m.state === 'INIT' ? 'var(--mute)' : 'var(--dn)'; }
  if (m.type === 'prices') Object.entries(m.data).forEach(([k, v]) => upd(k, v));
  if (m.type === 'minute') {
    $('clock').textContent = m.close_ts.slice(11, 19);
    Object.entries(m.prices).forEach(([k, v]) => upd(k, v));
    const b = m.bars[roles.nifty]; if (b) { addBar(m.close_ts, b); draw(); }
  }
}
function upd(k, v) {
  const i = insts[k]; if (!i || i.kind !== 'EQ') return;
  if (!(k in first)) first[k] = v;
  let tr = rows[k];
  if (!tr) { tr = document.createElement('tr'); tr.innerHTML = `<td>${i.symbol}</td><td class="num"></td><td class="num"></td>`; $('tb').appendChild(tr); rows[k] = tr; }
  const td = tr.children[1], prev = parseFloat(td.textContent);
  td.textContent = v.toFixed(2);
  const ch = (v / first[k] - 1) * 100; tr.children[2].textContent = ch.toFixed(2); tr.children[2].style.color = ch >= 0 ? 'var(--up)' : 'var(--dn)';
  if (!isNaN(prev) && prev !== v) { td.className = 'num ' + (v > prev ? 'fu' : 'fd'); }
}
function addBar(ts, b) {  // aggregate 1m index bars into 5m for display
  const t = new Date(ts); const m = (t.getUTCHours() * 60 + t.getUTCMinutes() + 330 - 1 - 555); const bucket = Math.floor(m / 5);
  const last = bars[bars.length - 1];
  if (last && last.k === bucket) { last.h = Math.max(last.h, b[1]); last.l = Math.min(last.l, b[2]); last.c = b[3]; }
  else bars.push({ k: bucket, o: b[0], h: b[1], l: b[2], c: b[3] });
}
function draw() {
  const cv = $('cv'), ctx = cv.getContext('2d'); const W = cv.width = cv.clientWidth * devicePixelRatio, H = cv.height = cv.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, W, H); if (!bars.length) return;
  const hi = Math.max(...bars.map(b => b.h)), lo = Math.min(...bars.map(b => b.l)); const n = 75, w = W / n;
  const y = (p) => H - 10 - (p - lo) / (hi - lo || 1) * (H - 20);
  bars.forEach((b, i) => { const up = b.c >= b.o; ctx.strokeStyle = ctx.fillStyle = up ? '#22c55e' : '#ef4444';
    const x = i * w + w / 2; ctx.beginPath(); ctx.moveTo(x, y(b.h)); ctx.lineTo(x, y(b.l)); ctx.stroke();
    ctx.fillRect(x - w * .35, Math.min(y(b.o), y(b.c)), w * .7, Math.max(1, Math.abs(y(b.o) - y(b.c)))); });
}
$('go').onclick = async () => { bars = []; first = {}; $('tb').innerHTML = ''; rows = {};
  await fetch('/api/replay/start', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ date: $('day').value, speed: +$('speed').value }) }); };
$('speed').onchange = () => fetch('/api/replay/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ speed: +$('speed').value }) });
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause';
  fetch('/api/replay/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ paused }) }); };
init();
</script>
</body>
</html>
